[build-system]
requires = ["setuptools>=70.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vector-genetic-programming"
version = "0.1.0"
description = "GP-evolved trading strategies from multi-asset crypto data using DEAP + vectorbt"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [
  { name = "VGP Contributors" },
]
keywords = ["genetic-programming", "trading", "crypto", "deap", "vectorbt", "nsga2"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# These pins are mutually satisfiable and CI-verified — tests/test_smoke.py asserts
# both that they resolve against the installed environment and that every installed
# distribution's own requirements are met. Change them together, not individually.
#
# The binding constraint chain is:
#   vectorbt 1.1.0  requires  pandas>=3.0.3,<4.0  and  numpy>=2.4.6
#   numba 0.67.0    requires  numpy<2.6
# so numpy lands in [2.4.6, 2.6). An earlier revision of this file paired
# vectorbt==1.0.0 (which caps pandas<3.0) with pandas>=3.0.0, which no resolver
# could satisfy — `pip install -e .` failed outright.
dependencies = [
  # GP framework
  "deap==1.4.4",
  # Backtesting — vectorbt 1.x is a major rewrite from 0.x; do not use 0.x docs.
  # 1.1.0 is the first release supporting pandas 3; 1.0.0 caps pandas<3.0.
  "vectorbt>=1.1.0,<2.0",
  # Lower bound from vectorbt 1.1.0; upper bound from numba 0.67's numpy<2.6.
  "numpy>=2.4.6,<2.6",
  # numba>=0.67.0 is required for numpy>=2.4 (0.61.x caps numpy<2.3)
  "numba>=0.67.0",
  # Data — pandas 3 required by vectorbt>=1.1.0
  "pandas>=3.0.3,<4.0",
  "pyarrow>=18.0",
  "scipy>=1.13",
  # ML utilities
  "scikit-learn>=1.7.0,<2.0",
  "joblib>=1.4.0,<2.0",
  # Visualization
  "matplotlib>=3.9.0,<4.0",
  "networkx>=3.3",
  # plotly 6 removed scattermapbox, which vectorbt still registers in its
  # figure templates at import time — vectorbt raises ValueError on import.
  "plotly>=5.22,<6.0",
  "seaborn>=0.13",
  # Serialization — dill handles closures that pickle cannot (needed for DEAP checkpoints)
  "dill>=0.3.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  # used by tests/test_smoke.py to check the dependency set resolves
  "packaging>=24.0",
  "pytest-benchmark>=4.0",
  # Pinned to a major series for the same reason as ruff below: CI gates on
  # `black --check`, and black versions its stable style by calendar year, so
  # an unpinned formatter reformats the whole tree the January it rolls over.
  "black>=26.5.1,<27",
  # Pinned to a minor series because CI gates on `ruff check`: ruff is pre-1.0 and
  # adds rules in minor releases, which would turn the gate red on unchanged code.
  "ruff>=0.16.6,<0.17",
  "mypy>=1.10",
  "jupyterlab>=4.0",
  "nbstripout>=0.7",
]
# mlflow requires pandas<3, which conflicts with our pandas>=3.0.0 core requirement.
# Install this extra only when you need MLflow tracking and are OK running it against
# a pandas<3 environment (e.g., a separate venv or a service-mode tracking server).
# Phase 4 tracking approach: NoOpTracker (default) + optional MLflowTracker (D-02/D-03).
tracking = [
  "mlflow>=3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["vgp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
