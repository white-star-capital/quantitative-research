name: CI

on:
  push:
    branches: ["**"]   # run on every push so the smoke gate fires during development, not just at merge
  pull_request:
    branches: [main]

jobs:
  smoke-test:
    name: Smoke Test (Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install package and dev dependencies
        run: pip install -e ".[dev]"

      - name: Run smoke tests
        run: pytest tests/test_smoke.py -v

      # The numpy/numba bound is asserted inside tests/test_smoke.py, read from
      # numba's installed metadata. It is deliberately NOT duplicated as a
      # hardcoded literal here — the previous `numpy<2.3` step was numba 0.61's
      # ceiling and went stale when numba 0.67 raised it to <2.6.
      - name: Verify dependency set resolves and is self-consistent
        run: pip check
