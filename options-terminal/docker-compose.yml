# Local stack: `make start` / `make stop` (see Makefile). Only the frontend is published; it
# proxies /v1 to the API, so the browser sees one origin. Secrets come from .env (generated by
# `make start`, gitignored).
#
# Database: Supabase when .env sets SUPABASE_PROJECT_REF (the Makefile then exports
# RUNNER_DATABASE_URL / API_DATABASE_URL for the session pooler and leaves the `local` profile
# off), otherwise the `db` container below (profile `local`).
name: options-terminal

x-project-label: &project-label
  com.options-terminal.project: options-terminal

services:
  db:
    image: postgres:17
    profiles: [local]
    labels: *project-label
    environment:
      POSTGRES_DB: options_terminal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      RUNNER_DB_PASSWORD: ${RUNNER_DB_PASSWORD:-}
      API_DB_PASSWORD: ${API_DB_PASSWORD:-}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./contracts/db/migrations:/migrations:ro
      - ./docker/db/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d options_terminal"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
      labels: *project-label
    labels: *project-label
    environment:
      DATABASE_URL: ${API_DATABASE_URL:-postgres://api:${API_DB_PASSWORD:-}@db:5432/options_terminal}
      API_BIND: 0.0.0.0:8080
      CONTRACTS_DIR: /app/contracts
      RUST_LOG: info
    depends_on:
      db:
        condition: service_healthy
        required: false  # absent when running against Supabase
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/ready"]
      interval: 3s
      timeout: 3s
      retries: 40
    restart: unless-stopped

  runner:
    build:
      context: .
      dockerfile: models/Dockerfile
      labels: *project-label
    labels: *project-label
    environment:
      DATABASE_URL: ${RUNNER_DATABASE_URL:-postgresql://runner:${RUNNER_DB_PASSWORD:-}@db:5432/options_terminal}
      SNAPSHOT_DIR: /data/snapshots
      TERMINAL_GIT_SHA: ${TERMINAL_GIT_SHA:-0000000}  # envelope schema: 7-40 hex chars
    volumes:
      - snapshots:/data/snapshots
    depends_on:
      db:
        condition: service_healthy
        required: false  # absent when running against Supabase
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      labels: *project-label
    labels: *project-label
    ports:
      - "${FRONTEND_PORT:-3000}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  pgdata:
    labels: *project-label
  snapshots:
    labels: *project-label
