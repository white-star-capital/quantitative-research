# Local stack: `make start` / `make stop` (see Makefile). Only the frontend is published; it
# proxies /v1 to the API, so the browser sees one origin.
#
# Database: one connection string for everything:
#   - Supabase: SUPABASE_DB_URL from .env (Connect > Session pooler URI; TLS is negotiated);
#   - otherwise the `db` container (profile `local`) as postgres.
# No login users: the runner and API `SET ROLE` (DB_ROLE) to runner_rw / api_ro on connect.
name: options-terminal

x-project-label: &project-label
  com.options-terminal.project: options-terminal

x-database: &database
  DATABASE_URL: ${SUPABASE_DB_URL:-postgresql://postgres:${POSTGRES_PASSWORD:-}@db:5432/options_terminal}

services:
  db:
    image: postgres:17
    profiles: [local]
    labels: *project-label
    environment:
      POSTGRES_DB: options_terminal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d options_terminal"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # One-shot on every start: migrations if the schema is absent, roles' SET ROLE grants,
  # Supabase anon lockdown and row-level security (docker/db/setup.sql). Idempotent.
  db-init:
    image: postgres:17
    labels: *project-label
    environment:
      <<: *database
    volumes:
      - ./contracts/db/migrations:/migrations:ro
      - ./docker/db:/setup:ro
    entrypoint: ["sh", "/setup/setup.sh"]
    depends_on:
      db:
        condition: service_healthy
        required: false  # absent when running against Supabase
    restart: "no"

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
      labels: *project-label
    labels: *project-label
    environment:
      <<: *database
      DB_ROLE: api_ro
      API_BIND: 0.0.0.0:8080
      CONTRACTS_DIR: /app/contracts
      RUST_LOG: info
    depends_on:
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/ready"]
      interval: 3s
      timeout: 3s
      retries: 40
    restart: unless-stopped

  runner:
    build:
      context: .
      dockerfile: models/Dockerfile
      labels: *project-label
    labels: *project-label
    environment:
      <<: *database
      DB_ROLE: runner_rw
      SNAPSHOT_DIR: /data/snapshots
      TERMINAL_GIT_SHA: ${TERMINAL_GIT_SHA:-0000000}  # envelope schema: 7-40 hex chars
    volumes:
      - snapshots:/data/snapshots
    depends_on:
      db-init:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      labels: *project-label
    labels: *project-label
    ports:
      - "${FRONTEND_PORT:-3000}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  pgdata:
    labels: *project-label
  snapshots:
    labels: *project-label
