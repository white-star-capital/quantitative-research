bounds:                         # keyed by value key (column / item / series)
  rv_forecast: { min: 0.05, max: 5.0 }
  rv_low: { min: 0.05, max: 5.0 }
  rv_high: { min: 0.05, max: 5.0 }
  abs_vrp_z: { max: 10 }
sanity_checks:
  - vrp_band_ordering           # rv_low ≤ rv_forecast ≤ rv_high on every tenor; violation = bug
