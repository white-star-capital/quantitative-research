implementation_id: rv_har
version: 1.0.0
fills_slot: vrp_signal
owner: alejandro
description: HAR-RV with day-of-week and event-window dummies; forecast RV cone vs ATM IV, VRP z on DVOL.
schedule: "5 * * * *"           # minute 5, after bs_pricer and parity in the same pass (VRP-A-6)
timeout_seconds: 60
max_input_age_seconds: 120      # Deribit inputs carry usOut; Hyperliquid's clock candle is ≤ ~60 s behind
params:
  # RV input per asset (VRP-A-7, A-8), turned into the `rv_daily` InputSpec. resolution is minutes.
  # BTC/ETH stay on hourly bars until Deribit's 5-min depth and row cap are verified live.
  # SOL/HYPE: no Deribit perpetual in the shapes seen so far (adapters/deribit/README.md), so
  # Hyperliquid hourly candles (~5,000 per interval, UNVERIFIED); the day cache grows the history.
  rv_sources:
    BTC: { venue: deribit, resolution: "60", lookback_days: 1000, min_coverage: 0.9 }
    ETH: { venue: deribit, resolution: "60", lookback_days: 1000, min_coverage: 0.9 }
    SOL: { venue: hyperliquid, resolution: "60", lookback_days: 1000, min_coverage: 0.9 }
    HYPE: { venue: hyperliquid, resolution: "60", lookback_days: 1000, min_coverage: 0.9 }
  min_history_days: { BTC: 365, ETH: 365, SOL: 150, HYPE: 150 }  # non-null RV days to fit
  tenors: [7, 14, 30, 60]
  horizon_days: 60
  har_lags: [1, 5, 22]
  quantiles: [0.1, 0.5, 0.9]
  ewma_lambda: 0.94
  z_window_days: 90
  z_min_obs: 60
  window_min_days: 24
  history_days: 365
  history_refit_every: 5          # expanding-origin refits, counted back from C (§12.6); ~2-3 s a run
  event_hump_share: 0.35
  rv_sanity: { min: 0.05, max: 5.0 }   # annualized; outside → degenerate_forecast (VRP-A-13)
  # Surface (core/quant/surface.py build_expiries), same values as bs_pricer_black76.
  usd_rate: 0.0
  min_tte_hours: 1
  min_nodes_per_expiry: { BTC: 5, ETH: 5, SOL: 3, HYPE: 3 }
  max_node_spread_vp: 10
  # Days [before, after] the event's UTC day (core/quant/calendar.py window), per type (VRP-A-9).
  event_windows:
    fomc: [1, 1]
    cpi: [1, 1]
    opex_monthly: [1, 1]
    opex_quarterly: [2, 1]
    token_unlock: [3, 2]
    halving: [3, 3]
    custom: [0, 0]
  # Last date through which each scheduled type's list below is complete. A run whose horizon
  # (plus window) reaches past it disables the signal with event_calendar_incomplete
  # (core/quant/calendar.py incomplete_types). Move a date only with the entries that fill it.
  events_listed_through:
    fomc: "2026-12-31"
    cpi: "2025-10-31"
  # Opex is derived by rule (core/quant/calendar.py). VERIFY before promotion: every date below
  # was entered from the published calendars without live access to them; check each against
  # federalreserve.gov and bls.gov. Times are the release time in UTC (FOMC statement 14:00 ET,
  # CPI 08:30 ET). Each edit bumps the version (M-11).
  events:
    # FOMC: second day of each scheduled meeting.
    - { type: fomc, scope: GLOBAL, ts: "2024-01-31T19:00:00Z", source: "federalreserve.gov FOMC calendar" }
    - { type: fomc, scope: GLOBAL, ts: "2024-03-20T18:00:00Z", source: "federalreserve.gov FOMC calendar" }
