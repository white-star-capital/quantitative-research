[package]
name = "options-terminal-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Read-only JSON API over stored model runs (see ../API.md)"
publish = false

[dependencies]
async-trait = "=0.1.92"
axum = "=0.8.9"
chrono = { version = "=0.4.45", default-features = false, features = ["std", "clock", "serde"] }
governor = { version = "=0.10.4", default-features = false, features = ["std"] }
libm = "=0.2.16"
moka = { version = "=0.12.16", features = ["sync"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate", "chrono", "uuid", "json"] }
thiserror = "=2.0.21"
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "signal", "net", "time"] }
tower = { version = "=0.5.3", features = ["util"] }
tower-http = { version = "=0.6.11", features = ["trace", "cors", "compression-gzip", "compression-br", "timeout", "limit", "request-id", "set-header", "map-request-body"] }
tower_governor = { version = "=0.8.0", default-features = false, features = ["axum"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["json", "env-filter"] }
utoipa = { version = "=5.5.0", features = ["axum_extras", "chrono", "uuid"] }
uuid = { version = "=1.26.1", features = ["serde", "v7"] }

[dev-dependencies]
http-body-util = "=0.1.5"
