slot_id: vrp_signal
title: RV forecast and VRP signal
description: >
  Calendar- and event-aware realized-vol forecast per tenor against ATM implied
  vol, with the vol-risk-premium z-score and its baseline/seasonal/event
  decomposition. Advisory only; never sizes.
payload_kind: composite
payload_version: "1"
scope:
  dimensions: [underlying]
  allowed:
    underlying: [BTC, ETH, SOL, HYPE]
max_age_seconds: 7200
conventions: >
  Target is log daily realized variance, RV_d = sum of squared intraday log returns over
  one UTC day (day closes 00:00 UTC; completed days only). Vols annualized over 365 calendar
  days, 24/7: RV(T) = sqrt(365/T * sum of forecast daily variances). Vols and VRP decimal.
  vrp_z per RV_FORECAST_IMPLEMENTATION_GUIDE.md VRP-A-5: BTC/ETH 30d only, (DVOL - RV forecast 30d)
  against its trailing 90-day mean and std from an in-run expanding-origin forecast; null elsewhere.
  Payload sections per §12 of the guide.
display:
  default_view: vrp_signal     # bespoke view; generic composite renderer as fallback
  order: 3
