# Static app + same-origin proxy to the API (docker-compose.yml). Security headers follow
# front_end_design.md §9 / building_secure_front_ends.md: strict CSP, no inline script or style.
# The access log omits the query string: evaluate requests carry quotes (API.md A-34).
log_format no_query '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent $request_time';

# API responses keep their own Cache-Control (API.md A-12); an empty value adds no header.
map $uri $static_cache {
    ~^/v1/      "";
    ~^/assets/  "public, max-age=31536000, immutable";
    default     "no-cache";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    access_log /var/log/nginx/access.log no_query;
    server_tokens off;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cache-Control $static_cache;

    location /v1/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-Id $request_id;
    }
    location = /health { proxy_pass http://api:8080; }
    location = /ready { proxy_pass http://api:8080; }
    location /assets/ { try_files $uri =404; }
    location / { try_files $uri /index.html; }
}
